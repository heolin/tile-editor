<!doctype html>
<html lang="pl" data-theme="monokai-pro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#19181a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Tile Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied before the first paint: reading the choice after React mounts
      // would flash the default theme first.
      try {
        var saved = localStorage.getItem('tile-editor:theme')
        if (saved) document.documentElement.dataset.theme = saved
      } catch (error) {}

      // The browser offers installation once and does not offer it again, so
      // the event has to be caught here: by the time React mounts it is gone.
      window.__tileEditorInstall = null
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__tileEditorInstall = event
        window.dispatchEvent(new Event('tile-editor:installable'))
      })
      window.addEventListener('appinstalled', function () {
        window.__tileEditorInstall = null
        window.dispatchEvent(new Event('tile-editor:installable'))
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
