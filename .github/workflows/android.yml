name: APK

# Building the Android app needs a JDK, the Android SDK and Gradle - together
# far more than a phone running Termux can host. So the APK is built here and
# downloaded, while Termux stays the place the editor actually runs.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Zbuduj wariant release zamiast debug
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The `secrets` context is not readable from a step's `if`, only `env` is.
    # Lifting the keystore here is what lets the signing step ask whether one
    # was configured at all.
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Zbuduj rdzeń, serwer i UI
        run: npm run build

      - name: Sprawdź typy i testy
        run: |
          npm run typecheck
          npx vitest run

      # Capacitor 7 needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Skopiuj zbudowane UI do projektu natywnego
        run: npx cap sync android

      - name: Zbuduj APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ inputs.release }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Podpisz APK
        # Only when a keystore is configured; a debug build is already signed
        # with the shared debug key and installs fine for sideloading.
        if: ${{ inputs.release && env.ANDROID_KEYSTORE != '' }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Newest build-tools wins; the glob is sorted, so take the last.
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$signer" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Wyślij APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: tile-editor-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
